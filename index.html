/* Bot Studio login — dezelfde Cloudflare Worker als de Bot Tracker */
.studio-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 15px;background:#121116}
.studio-gate-card{width:min(100%,430px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 20px}
.studio-gate-title{font-weight:850;letter-spacing:-.035em;color:var(--pink);font-size:28px;margin:0 0 8px}
.studio-gate-sub{font-size:13px;color:var(--muted);margin:0 0 22px}
.studio-gate-row{display:flex;gap:8px;align-items:center}
.studio-gate-row input{flex:1;min-width:0;width:auto;font-size:16px;background:#28232d;color:var(--text);border:1px solid #4d4354;border-radius:11px;padding:11px}
.studio-gate-row button{flex:none;min-height:45px}
.studio-gate-status{min-height:18px;margin:12px 0 0;font-size:12px;color:var(--warning)}
.studio-gate-status.ok{color:var(--success)}

/* Bot Studio — layout + visual refinement, round 1 (25 Oct 2026)
   Reference palette: deep plum, muted mauve fields, dusty-rose accents.
   Use available system fonts; no external font files or requests. */
:root{
  --bg:#2c2932;
  --panel:#352f3b;
  --panel2:#4b4353;
  --panel3:#504657;
  --line:#73677d;
  --text:#f3e8f1;
  --muted:#bdb0c7;
  --accent:#baa7cd;
  --pink:#c2749b;
  --soft:rgba(188,155,202,.19);
  font-family:"Avenir Next","Avenir","Century Gothic","Calibri","Trebuchet MS",sans-serif;
  font-weight:400;
}
body{background:var(--bg);font-size:14px;font-weight:400;letter-spacing:.01em}
button,input,textarea,select{font-family:inherit;font-weight:400;letter-spacing:.005em}
.appbar{background:rgba(44,41,50,.98);border-bottom-color:rgba(180,155,192,.21)}
.brand{letter-spacing:-.025em;color:var(--pink);font-weight:650}
.headsub{color:var(--muted)}
h1,h2,h3{letter-spacing:0;font-weight:650}
h2{color:#e9d7e6}
h3,.fieldlabel{color:#e6d3e3}
.section{background:var(--panel);border-color:rgba(183,160,196,.3);border-radius:16px}
.section.soft,.block{background:#393240}
.card{background:var(--panel);border-color:rgba(183,160,196,.3)}
.cardimage{background:var(--panel2)}
.iconbtn,.ghost,.button,.primary,.danger,.tab{
  border-radius:13px;
  background:#433b4b;
  border-color:#6e6177;
  color:var(--text);
  font-weight:550;
}
.primary,.tab.active{background:#57485f;border-color:#a891b6;color:#f5e7f4}
.primary{font-weight:650}
.tab{font-size:12px;min-height:42px;padding:9px 13px;letter-spacing:.01em}
.tab.active{box-shadow:inset 0 -2px 0 rgba(202,147,177,.7)}
.tabs{background:var(--bg);gap:7px;top:79px;padding:4px 0 9px}
.pill{background:#504657;border-color:#82748c;color:#ecdaee}
.ctrl,textarea,select,input[type="text"],input[type="url"],input[type="number"],input[type="search"]{
  background:#4b4353;
  border:1.5px solid #9885a5;
  border-radius:11px;
  color:#f6eaf3;
  font-size:16px;
  font-weight:400;
}
input::placeholder,textarea::placeholder{color:#c5b7c9;opacity:.8}
textarea{line-height:1.55}
label.fieldlabel{font-size:12px;font-weight:600;letter-spacing:.005em}
.fieldtop{margin-bottom:6px}
.fieldtop .fieldlabel{margin:0}
.field{margin-bottom:19px}
/* A single-line title, shorter introduction, and two equally spacious writing areas. */
.field[data-field="title"] input[data-prop="title"]{height:45px;min-height:45px;padding:9px 12px}
.field[data-field="introduction"] textarea{height:102px;min-height:102px}
.field[data-field="greeting"] textarea,
.field[data-field="background"] textarea{height:350px;min-height:300px}
.field[data-field="personality"] textarea,
.field[data-field="appearance"] textarea{height:175px;min-height:130px}
.field[data-field="story"] textarea{height:230px;min-height:180px}
.textactions{margin:7px 0 0;gap:7px}
.textactions button{font-size:12px;min-height:34px;border-radius:10px;padding:6px 10px}
.count{font-size:12px;font-weight:500;color:#dbcce0}
.limitbox input{background:#403748;border:1px solid #746780;border-radius:9px;font-size:12px}
.autosave-help{color:var(--muted);font-size:11px;margin:7px 0 5px}
.editor-tools{gap:7px}
.editor-tools .button{border-radius:11px}
.studio-gate{background:var(--bg)}
.studio-gate-card{background:var(--panel);border-color:var(--line)}
.studio-gate-title{color:var(--pink)}
@media(max-width:480px){
  .shell{padding-left:13px;padding-right:13px}
  .section{padding:13px}
  .field[data-field="greeting"] textarea,
  .field[data-field="background"] textarea{height:340px;min-height:280px}
  .tab{font-size:12px;padding:10px 12px}
  .editor-tools .button{min-height:37px}
}

</style>
</head>
<body>
<section id="studioGate" class="studio-gate" aria-label="Bot Studio aanmelden">
  <div class="studio-gate-card">
    <p class="studio-gate-title">💟 bot studio 🔒</p>
    <p class="studio-gate-sub">Gebruik hetzelfde wachtwoord als je Bot Tracker.</p>
    <form id="studioLoginForm" autocomplete="on">
      <label class="fieldlabel" for="studioPassword">password</label>
      <div class="studio-gate-row">
        <input type="password" id="studioPassword" name="password" autocomplete="current-password" required autofocus>
        <button type="submit" id="studioUnlockButton" class="primary">unlock</button>
      </div>
      <p class="studio-gate-status" id="studioGateStatus" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
<div class="shell" id="studioShell" hidden>
<header class="appbar" id="apphead"><div class="brand"><span class="heart">💟</span> bot studio<span class="headsub">creator & archive</span></div><span class="saveflag" id="saveflag"></span><button class="iconbtn" id="studioLockButton" type="button" title="Studio vergrendelen" aria-label="Studio vergrendelen">🔒</button><button class="iconbtn" type="button" data-nav="data" aria-label="Back-up en instellingen">⚙</button></header>
<main id="view"><div class="empty">Studio openen…</div></main>
</div>
<div id="toast" class="toasty" role="status" aria-live="polite" hidden></div>
<script>
(()=>{'use strict';
const DB_NAME='poly-bot-studio-v1', DB_VERSION=1;
const statuses=['Idea','Draft','Rewrite','Created','Fixed','Archived'];
const kinds=['Regular','Theme','Multi'];
const fieldSpecs=[
  ['title','Bot title',36,'Titel voor PolyBuzz'],
  ['introduction','Introduction',200,'Korte introductie / hook'],
  ['greeting','Greeting',3000,'Je openingsscène en eerste dialoog'],
  ['background','Background',10000,'De hoofdachtergrond van je character'],
  ['personality','Personality',0,'Eigen werkveld — bewaar karaktertrekken'],
  ['appearance','Appearance',0,'Eigen werkveld — uiterlijk voor de bot'],
  ['story','Story / creator notes',0,'Vrij veld voor plot, losse ideeën en notities']
];
const promptChips=['realistic','high resolution','spicy','casual','iPhone snapshot','bad quality','3/4 angle','low POV','high POV','looking at camera','face hidden','candid','natural skin','flash photography','cinematic','close-up','full body','dark mood','mirror selfie','natural light'];
const $=s=>document.querySelector(s), root=$('#view'), head=$('#apphead');
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v||0).toLocaleString('nl-NL');
const now=()=>new Date().toISOString();
const date=v=>v?new Date(v).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'}):'—';
const safeUrl=v=>/^https?:\/\//i.test(String(v||''))?String(v):'';
const stamp=p=>p.updatedAt?p.updatedAt:p.createdAt;
const clone=v=>JSON.parse(JSON.stringify(v));
let db=null, projects=[], identities=[], cur=null, currentKind='', activeTab='write', viewName='catalog', sort='recent', filter='All', search='', visibleCount=48, saveTimer=0, writing=Promise.resolve(), toastTimer=0, moreObserver=null;
function projectNew(type){let t=now(),limits={};fieldSpecs.forEach(([id,,limit])=>limits[id]=limit);return {id:uid(),name:'',type,status:'Idea',createdAt:t,updatedAt:t,cid:'',trackerUrl:'',theme:'',categories:'',tags:'',pov:'you',narrator:'user',userRole:'',userDynamics:'',userFreedom:'',ageOverride:'',title:'',introduction:'',greeting:'',background:'',personality:'',appearance:'',story:'',limits,dialogueLimit:10000,dialogue:[{id:uid(),label:'',text:''}],identityIds:[],relations:{},avatars:{main:null,spicy:null,reserve:null},revisions:[]}}
function identityNew(){let t=now();return {id:uid(),name:'',createdAt:t,updatedAt:t,aliases:'',age:'',appearance:'',voiceName:'',voiceNotes:'',voiceId:'',generatorUrl:'',editorUrl:'',promptBase:'',selectedChips:[],avatars:{main:null,spicy:null,reserve:null}}}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;for(const name of ['projects','identities'])if(!d.objectStoreNames.contains(name))d.createObjectStore(name,{keyPath:'id'})};req.onerror=()=>reject(req.error);req.onsuccess=()=>resolve(req.result)} )}
function txRun(store,method,value){return new Promise((resolve,reject)=>{const t=db.transaction(store,method==='getAll'?'readonly':'readwrite'),r=t.objectStore(store)[method](value);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function all(store){return new Promise((resolve,reject)=>{const r=db.transaction(store,'readonly').objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function setFlag(s,ok=false){const el=$('#saveflag');el.textContent=s;el.classList.toggle('saved',ok)}
function toast(s){const box=$('#toast');box.textContent=s;box.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.hidden=true,3200)}
function deferSave(){setFlag('● bezig…');clearTimeout(saveTimer);saveTimer=setTimeout(saveCurrent,570)}
function saveCurrent(){clearTimeout(saveTimer);if(!cur)return Promise.resolve();cur.updatedAt=now();const snapshot=clone(cur),store=currentKind==='project'?'projects':'identities';writing=writing.catch(()=>{}).then(()=>txRun(store,'put',snapshot));return writing.then(()=>{setFlag('✓ opgeslagen',true);if(store==='projects'){let ix=projects.findIndex(x=>x.id===snapshot.id);if(ix>=0)projects[ix]=snapshot;else projects.push(snapshot)}else{let ix=identities.findIndex(x=>x.id===snapshot.id);if(ix>=0)identities[ix]=snapshot;else identities.push(snapshot)}}).catch(e=>{setFlag('⚠ opslagfout');toast('Opslaan mislukt: '+e.message)})}
async function flush(){if(saveTimer){clearTimeout(saveTimer);await saveCurrent()}else await writing.catch(()=>{})}
function navHeader(){head.innerHTML=`<div class="brand"><span class="heart">💟</span> bot studio<span class="headsub">creator & archive</span></div><span class="saveflag" id="saveflag"></span><button class="iconbtn" id="studioLockButton" type="button" title="Studio vergrendelen" aria-label="Studio vergrendelen">🔒</button><button class="iconbtn" data-nav="data" aria-label="Back-up en instellingen">⚙</button>`}
async function go(v,id,tab){await flush();cur=null;currentKind='';activeTab=tab||'write';viewName=v;navHeader();if(v==='catalog')renderCatalog();if(v==='choose')renderChoose();if(v==='identities')renderVault();if(v==='editor'){cur=projects.find(p=>p.id===id)||null;currentKind='project';if(cur)renderEditor();else renderCatalog()}if(v==='identity'){cur=identities.find(p=>p.id===id)||null;currentKind='identity';if(cur)renderIdentity();else renderVault()}if(v==='data')renderData();scrollTo({top:0,behavior:'instant'})}
function bindHeaderBack(label, cbData){head.innerHTML=`<button class="iconbtn" data-nav="${cbData}" aria-label="Terug">←</button><div class="brand" style="font-size:19px">${esc(label)}<span class="headsub">bot studio 💟</span></div><span class="saveflag" id="saveflag">✓ opgeslagen</span><button class="iconbtn" id="studioLockButton" type="button" title="Studio vergrendelen" aria-label="Studio vergrendelen">🔒</button><button class="iconbtn" data-nav="data" aria-label="Back-up">⚙</button>`}
function avatarFor(p){return p.avatars?.main||p.identityIds?.map(id=>identities.find(x=>x.id===id)?.avatars?.main).find(Boolean)||null}
function imageBox(src,icon='👤'){return src?`<img src="${src}" alt="Character avatar" loading="lazy">`:`<span class="placeholder" aria-hidden="true">${icon}</span>`}
function card(p,type){const src=type==='project'?avatarFor(p):p.avatars?.main;const name=type==='project'?(p.name||p.title||'Untitled character'):(p.name||'Unnamed identity');const summary=type==='project'?`${esc(p.type)} · ${date(stamp(p))}`:`Passport · ${date(stamp(p))}`;return `<button class="card" data-open-${type}="${esc(p.id)}"><div class="cardimage">${imageBox(src)}<span class="pill" style="position:absolute;top:8px;left:8px;background:#211e26d9">${type==='project'?esc(p.status):'🪪 Identity'}</span></div><div class="cardbody"><div class="cardtitle">${esc(name)}</div><div class="cardmeta"><span>${summary}</span><span>↗</span></div></div></button>`}
function watchMore(){if(moreObserver){moreObserver.disconnect();moreObserver=null}const button=$('#moreCards');if(!button||!('IntersectionObserver' in window))return;moreObserver=new IntersectionObserver(rows=>{if(rows.some(r=>r.isIntersecting)){moreObserver.disconnect();button.click()}},{rootMargin:'300px 0px'});moreObserver.observe(button)}
function updateCatalogList(){const el=$('#catalogResults');if(el)el.innerHTML=catalogItems(filteredProjects());watchMore()}
function renderCatalog(){viewName='catalog';currentKind='';navHeader();const list=filteredProjects();root.innerHTML=`<div class="row spread"><div><p class="eyebrow">Your creative archive</p><h1 style="margin-bottom:3px">Character catalog</h1><p class="hint">${n(projects.length)} creaties · alles op één plek</p></div><button class="primary" data-nav="choose">＋ Create</button></div><div class="catalogtools"><input type="search" id="search" placeholder="Zoek naam, ideeën, categorieën…" value="${esc(search)}" aria-label="Zoek bots"><select id="statusFilter" aria-label="Filter status"><option>All</option>${statuses.map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select><select class="allwide" id="sortSelect" aria-label="Sorteer"><option value="recent" ${sort==='recent'?'selected':''}>Last edited</option><option value="new" ${sort==='new'?'selected':''}>Newest created</option><option value="old" ${sort==='old'?'selected':''}>Oldest created</option><option value="name" ${sort==='name'?'selected':''}>Alphabetical</option></select></div><div class="navrow" style="margin-bottom:14px"><button class="ghost tiny" data-nav="identities">🪪 Identity Vault (${identities.length})</button><button class="ghost tiny" data-nav="data">💾 Back-ups</button></div><div id="catalogResults">${catalogItems(list)}</div>`;if(search)$('#search')?.focus({preventScroll:true});watchMore();setFlag('')}
function filteredProjects(){let arr=projects.filter(p=>(filter==='All'||p.status===filter)&&(!search||[p.name,p.title,p.type,p.status,p.categories,p.tags,p.theme].some(x=>String(x||'').toLowerCase().includes(search.toLowerCase()))));arr.sort((a,b)=>sort==='name'?(a.name||a.title||'').localeCompare(b.name||b.title||''):sort==='new'?b.createdAt.localeCompare(a.createdAt):sort==='old'?a.createdAt.localeCompare(b.createdAt):stamp(b).localeCompare(stamp(a)));return arr}
function catalogItems(arr){return arr.length?`<div class="cards" id="catalogCards">${arr.slice(0,visibleCount).map(p=>card(p,'project')).join('')}</div>${arr.length>visibleCount?`<button class="button showmore" id="moreCards">Meer laden (${n(arr.length-visibleCount)} over)</button>`:''}`:`<div class="empty"><div style="font-size:40px">💟</div><b>Nog geen creaties gevonden</b><p class="hint" style="margin:9px 0 0">Begin met + Create of pas je filter aan.</p></div>`}
function renderChoose(){bindHeaderBack('Create new','catalog');root.innerHTML=`<p class="eyebrow">💟 New creation</p><h1>Wat wil je maken?</h1><p class="hint">Je kunt meteen opslaan, ook met lege tekstvelden.</p><div class="modegrid"><button class="mode" data-create="Regular">🖤 Regular<span>Gewone bot met eigen verhaal, user role en dialogen.</span></button><button class="mode" data-create="Theme">💟 Theme<span>Extra plek voor thema-vereisten en user role.</span></button><button class="mode" data-create="Multi">👥 Multi<span>Meerdere personages en gezamenlijke background.</span></button></div><div class="section soft"><p class="hint" style="margin:0">Alle creaties komen in dezelfde catalogus. Je kunt hun type later nog wijzigen.</p></div>`}
function renderEditor(){viewName='editor';bindHeaderBack('character editor','catalog');if(!cur.dialogue?.length)cur.dialogue=[{id:uid(),label:'',text:''}];cur.limits=cur.limits||{};cur.avatars=cur.avatars||{main:null,spicy:null,reserve:null};cur.identityIds=cur.identityIds||[];cur.relations=cur.relations||{};
let title=cur.name||cur.title||'Untitled character';root.innerHTML=`<div class="editorheading"><div class="edavatar">${imageBox(avatarFor(cur))}</div><div class="edtitle"><p class="eyebrow" style="margin-bottom:4px">${esc(cur.type)} · ${esc(cur.status)}</p><h1>${esc(title)}</h1><p class="hint">Laatste wijziging: ${date(cur.updatedAt)}</p></div></div><div class="row editor-tools"><button class="button tiny" data-action="save" title="Bewaar de huidige wijzigingen (die worden ook automatisch opgeslagen)">Save changes</button><button class="button tiny" data-action="saveversion" title="Bewaar een aparte versie die je later kunt terugzetten">Save version</button><button class="button tiny" data-action="rewrite">New rewrite</button></div><p class="autosave-help">Auto-save staat aan · Save version bewaart een afzonderlijk herstelpunt.</p><nav class="tabs" aria-label="Editor tabs">${[['write','💟 •story'],['dialogue','💬 •dialogue'],['cast','🆔 •char&amp;user'],['avatars','👤 •avatar'],['versions','🔤 •versions']].map(([id,l])=>`<button class="tab ${activeTab===id?'active':''}" data-tab="${id}">${l}</button>`).join('')}</nav><div id="tabbody">${editorTab()}</div>`;setFlag('✓ opgeslagen',true);refreshCounts()}
function editorTab(){if(activeTab==='write')return writeTab();if(activeTab==='dialogue')return dialogueTab();if(activeTab==='cast')return castTab();if(activeTab==='avatars')return avatarTab();if(activeTab==='versions')return versionsTab();return ''}
function fInput(prop,label,ph=''){return `<div class="field"><label class="fieldlabel" for="f_${prop}">${esc(label)}</label><input type="text" id="f_${prop}" data-prop="${prop}" value="${esc(cur[prop]||'')}" placeholder="${esc(ph)}"></div>`}
function textField(id,label,base,ph){let lim=Number(cur.limits?.[id]??base),value=String(cur[id]||'');const single=id==='title';const entry=single?`<input type="text" spellcheck="true" id="f_${id}" data-prop="${id}" value="${esc(value)}" placeholder="${esc(ph)}">`:`<textarea spellcheck="true" id="f_${id}" data-prop="${id}" placeholder="${esc(ph)}">${esc(value)}</textarea>`;return `<div class="field" data-field="${id}"><div class="fieldtop"><label class="fieldlabel" for="f_${id}">${esc(label)}</label><div class="limitbox"><span class="count" id="cnt_${id}">${n(value.length)} / ${lim?n(lim):'∞'}</span><input aria-label="Limiet ${esc(label)}" title="Eigen tekenlimiet (0 = geen)" type="number" inputmode="numeric" min="0" max="1000000" value="${lim}" data-limit="${id}"></div></div>${entry}<div class="textactions"><button class="button" data-copyfield="${id}">Copy</button>${single?'':`<button class="button" data-format="asterisk" data-target="f_${id}" title="Selectie tussen asterisks">* Action *</button><button class="button" data-format="quote" data-target="f_${id}">“ Dialogue ”</button>`}</div></div>`}
function writeTab(){return `<section class="section"><div class="section-title"><h2>Character project</h2><span class="pill purple">${esc(cur.type)}</span></div>${fInput('name','Project name','Naam in jouw catalogus')}<div class="two"><div class="field"><label class="fieldlabel">Type</label><select data-prop="type">${kinds.map(x=>`<option ${cur.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="fieldlabel">Status</label><select data-prop="status">${statuses.map(x=>`<option ${cur.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div>${cur.type==='Theme'?fInput('theme','PolyBuzz theme / requirements','Thema, opdracht of voorwaarden'):''}${fInput('categories','Your categories','mafia, dark romance, first love…')}${fInput('tags','PolyBuzz tags — eigen registratie','Typ tags, gescheiden door komma’s')}<p class="hint">PolyBuzz-tags zijn hier vrij invoerbaar, nog geen gesynchroniseerde officiële taglijst.</p></section><section class="section"><div class="section-title"><h2>Write your bot</h2><span class="hint">Live tekentellers · onbeperkt typen</span></div><p class="limitinfo">Limieten zijn voorlopig instelbare voorbeeldwaarden, geen geverifieerde PolyBuzz-waarden.</p>${fieldSpecs.map(([id,label,lim,ph])=>textField(id,label,lim,ph)).join('')}</section><section class="section"><h2>Tracker link</h2>${fInput('cid','PolyBuzz CID','Plak je character-ID')}${fInput('trackerUrl','Link naar bot in tracker / PolyBuzz','https://...')}${safeUrl(cur.trackerUrl)?`<a class="button tiny" href="${esc(safeUrl(cur.trackerUrl))}" target="_blank" rel="noopener noreferrer">↗ Open gekoppelde link</a>`:''}<p class="hint">Handmatige koppeling in V1; je Stats Tracker blijft ongewijzigd.</p></section>`}
function dialogueStats(){let pos=0,limit=Math.max(0,Number(cur.dialogueLimit??10000));return cur.dialogue.map((b,i)=>{let start=pos;pos+=String(b.text||'').length;let fit=Math.max(0,Math.min(String(b.text||'').length,limit-start));return {b,i,start,end:pos,fit,total:String(b.text||'').length,overflow:pos>limit}})}
function dialogueTab(){const stats=dialogueStats(), total=stats.at(-1)?.end||0,lim=Number(cur.dialogueLimit??10000),over=total>lim;return `<section class="section"><div class="section-title"><h2>Dialogue Style</h2><div class="limitbox"><span class="count ${over?'warn':''}" id="dialogueTotal">${n(total)} / ${n(lim)}</span><input type="number" min="0" max="1000000" value="${lim}" data-dialoguelimit="1" aria-label="Dialogue Style totaal limiet" title="Totale PolyBuzz-limiet"></div></div><p class="hint">Ieder blok wordt afzonderlijk gekopieerd. Je mag doorschrijven boven de grens.</p><div class="footerline"><div class="bar"><div id="dialoguebar" style="width:${lim?Math.min(100,total/lim*100):100}%" class="${over?'over':''}"></div></div></div><div id="overNotice">${over?`<div class="inline-warning">⚠ ${n(total-lim)} tekens boven je ingestelde limiet. Oranje markering toont precies waar de grens valt.</div>`:''}</div><div id="dialogueList">${stats.map(s=>blockHtml(s)).join('')}</div><button class="primary" data-action="addblock" style="width:100%;margin-top:6px">＋ Add dialogue block</button></section>`}
function blockHtml(s){let {b,i,total,fit,overflow}=s,partial=fit>0&&fit<total;const overHtml=overflow?`<div class="line-note">${fit===0?'Volledig buiten de limiet':`${n(fit)} tekens binnen · ${n(total-fit)} buiten de limiet`}</div><div class="preview-border" id="preview_${esc(b.id)}">${esc(b.text.slice(0,fit))}<span class="over-text">${esc(b.text.slice(fit))}</span></div>`:'';return `<div class="block" data-block="${esc(b.id)}"><div class="blockhead"><b>BLOCK ${String(i+1).padStart(2,'0')}</b><span class="${overflow?'overline':''}" id="blockcount_${esc(b.id)}">${n(total)} tekens${overflow?' · ⚠':''}</span></div><div class="field" style="margin-bottom:7px"><input aria-label="Label blok ${i+1}" placeholder="Label (optioneel, wordt niet gekopieerd)" data-blocklabel="${esc(b.id)}" value="${esc(b.label)}"></div><textarea spellcheck="true" data-blocktext="${esc(b.id)}" aria-label="Dialogue block ${i+1}" placeholder="Write your dialogue example…">${esc(b.text)}</textarea><div class="textactions"><button class="button" data-copyblock="${esc(b.id)}">📋 Copy</button><button class="button" data-format="asterisk" data-blocktarget="${esc(b.id)}">* Action *</button><button class="button" data-format="quote" data-blocktarget="${esc(b.id)}">“ Dialogue ”</button><button class="button" data-move="up" data-blockid="${esc(b.id)}" ${i===0?'disabled':''} aria-label="Blok omhoog">↑</button><button class="button" data-move="down" data-blockid="${esc(b.id)}" ${i===cur.dialogue.length-1?'disabled':''} aria-label="Blok omlaag">↓</button><button class="button" data-duplicate="${esc(b.id)}">⧉</button><button class="danger" data-removeblock="${esc(b.id)}">🗑</button></div><div class="blockoverflow" id="overflow_${esc(b.id)}">${overHtml}</div></div>`}
function refreshDialogue(){if(activeTab!=='dialogue')return;let stats=dialogueStats(),total=stats.at(-1)?.end||0,lim=Math.max(0,Number(cur.dialogueLimit??10000)),over=total>lim;const cnt=$('#dialogueTotal');if(cnt){cnt.textContent=`${n(total)} / ${n(lim)}`;cnt.className='count '+(over?'warn':'')}const bar=$('#dialoguebar');if(bar){bar.style.width=(lim?Math.min(100,total/lim*100):100)+'%';bar.className=over?'over':''}const notice=$('#overNotice');if(notice)notice.innerHTML=over?`<div class="inline-warning">⚠ ${n(total-lim)} tekens boven je ingestelde limiet. Oranje markering toont precies waar de grens valt.</div>`:'';stats.forEach(s=>{const c=document.getElementById('blockcount_'+s.b.id),o=document.getElementById('overflow_'+s.b.id);if(c){c.textContent=`${n(s.total)} tekens${s.overflow?' · ⚠':''}`;c.className=s.overflow?'overline':''}if(o)o.innerHTML=s.overflow?`<div class="line-note">${s.fit===0?'Volledig buiten de limiet':`${n(s.fit)} tekens binnen · ${n(s.total-s.fit)} buiten de limiet`}</div><div class="preview-border">${esc(s.b.text.slice(0,s.fit))}<span class="over-text">${esc(s.b.text.slice(s.fit))}</span></div>`:''})}
function castTab(){let linked=cur.identityIds||[];return `<section class="section"><div class="section-title"><h2>🪪 Linked identities / cast</h2><button class="button tiny" data-nav="identities">Identity Vault ↗</button></div><p class="hint">Één passport kun je in meerdere bots gebruiken. Multi-bots kunnen meerdere paspoorten koppelen.</p>${identities.length?identities.map(i=>`<label class="selectcheck"><input type="checkbox" data-cast="${esc(i.id)}" ${linked.includes(i.id)?'checked':''}><b>${esc(i.name||'Unnamed identity')}</b><small>${i.voiceName?esc(i.voiceName):'No voice yet'}</small></label>`).join(''):`<div class="empty">Nog geen paspoorten. <button class="button tiny" data-action="newidentity">＋ Create passport</button></div>`}${linked.length?`<h3 style="margin-top:17px">Relationships with {user}</h3><p class="hint">Bepaal uitsluitend de relatie en dynamiek. Appearance en persoonlijkheid van {user} blijven vrij.</p>${linked.map(id=>{const i=identities.find(x=>x.id===id);if(!i)return '';const r=cur.relations[id]||{};return `<div class="block"><b>${esc(i.name||'Unnamed')}</b><div class="field" style="margin-top:10px"><label class="fieldlabel">Relationship to {user}</label><input data-relation="${esc(id)}" data-relationfield="role" value="${esc(r.role||'')}" placeholder="e.g. husband, enemy, secret crush"></div><div class="field" style="margin:0"><label class="fieldlabel">Dynamic / character's feelings</label><textarea data-relation="${esc(id)}" data-relationfield="dynamic" style="min-height:76px" placeholder="Wat voelt/doet dit character? Niet invullen wat {user} voelt.">${esc(r.dynamic||'')}</textarea></div></div>`}).join('')}`:''}</section><section class="section"><h2>💜 User Role — open identity</h2><p class="hint">{user} mag zelf bepalen wie die is. Leg alleen vast wat voor deze bot of dit thema nodig is.</p><div class="two"><div class="field"><label class="fieldlabel">Narrative POV</label><select data-prop="pov"><option value="you" ${cur.pov==='you'?'selected':''}>Second person · you</option><option value="I" ${cur.pov==='I'?'selected':''}>First person · I</option><option value="third" ${cur.pov==='third'?'selected':''}>Third person</option><option value="mixed" ${cur.pov==='mixed'?'selected':''}>Mixed / custom</option></select></div><div class="field"><label class="fieldlabel">Narrator</label><select data-prop="narrator"><option value="user" ${cur.narrator==='user'?'selected':''}>{user}</option><option value="char" ${cur.narrator==='char'?'selected':''}>{char}</option><option value="other" ${cur.narrator==='other'?'selected':''}>Other</option></select></div></div>${textPlain('userRole','Fixed user role / story facts','e.g. married for three years; no occupation fixed')}${textPlain('userDynamics','Relationship dynamics / character reactions','e.g. when {user} stops chasing him, he wants her back')}${textPlain('userFreedom','What stays open to the player?','e.g. {user} appearance, job, feelings, reactions: open')}${cur.type==='Theme'?textPlain('theme','Theme requirements','Welke rol of verhaalfacts vereist het thema?'):''}</section>`}
function textPlain(id,label,placeholder){return `<div class="field"><div class="fieldtop"><label class="fieldlabel" for="f_${id}">${esc(label)}</label><span class="count" id="cnt_${id}">${n(String(cur[id]||'').length)} tekens</span></div><textarea id="f_${id}" style="min-height:92px" data-prop="${id}" placeholder="${esc(placeholder)}">${esc(cur[id]||'')}</textarea><div class="textactions"><button class="button" data-copyfield="${id}">📋 Copy</button></div></div>`}
function avatarTab(){return `<section class="section"><h2>🖼️ Project avatars</h2><p class="hint">Bewaar main, spicy en reserve apart. Het paspoort kan daarnaast een vaste gezichtsreferentie hebben.</p>${avatarSlots('project')}<p class="hint">Afbeeldingen worden verkleind voor lokale opslag. Originele bestanden blijven buiten deze app staan.</p></section><section class="section"><h2>🪪 Identity references</h2>${cur.identityIds?.length?cur.identityIds.map(id=>{let i=identities.find(x=>x.id===id);return i?`<div class="row spread" style="padding:9px 0;border-top:1px solid var(--line)"><span>${esc(i.name)} · ${esc(i.voiceName||'Voice not set')}</span><button class="button tiny" data-open-identity="${esc(id)}">Open passport ↗</button></div>`:''}).join(''):'<p class="hint">Koppel een identity via Cast & User om vaste face references en voices te hergebruiken.</p>'}</section>`}
function avatarSlots(mode){return ['main','spicy','reserve'].map(slot=>{let image=cur.avatars?.[slot],lab={main:'Main / published',spicy:'Spicy / alternate',reserve:'Reserve / back-up'}[slot];return `<div class="avatar-upload"><div class="avatar-preview">${image?`<img src="${image}" alt="${lab}">`:'👤'}</div><div class="avatar-body"><b style="font-size:13px">${lab}</b><div class="actions" style="margin-top:7px"><label class="filelabel">＋ Upload<input type="file" accept="image/*" data-avatar="${slot}" data-mode="${mode}"></label>${image?`<button class="danger tiny" data-deleteavatar="${slot}">Remove</button>`:''}</div></div></div>`}).join('')}
function versionsTab(){let arr=(cur.revisions||[]).slice().reverse();return `<section class="section"><h2>🕒 Saved versions</h2><p class="hint">Maak bewust een snapshot voor grote rewrites. Autosave bewaart je actuele draft; snapshots bewaren tekst, instellingen en dialogue blocks. Avatars blijven apart bewaard.</p><div class="field">${fInput('versionLabel','Snapshot label','e.g. Original published, Greeting rewrite…')}</div><button class="primary" data-action="saveversion">＋ Save version</button>${arr.length?arr.map(v=>`<div class="block"><div class="row spread"><div><b>${esc(v.label||'Snapshot')}</b><div class="hint">${new Date(v.at).toLocaleString('nl-NL')}</div></div><button class="button tiny" data-restoreversion="${esc(v.id)}">↶ Restore</button></div><div class="hint">${n(v.data?.dialogue?.length||0)} dialogue blocks · ${n(v.data?.background?.length||0)} background tekens</div></div>`).join(''):'<p class="hint" style="margin-top:15px">Nog geen snapshots.</p>'}<hr class="divider"><button class="danger tiny" data-action="deleteproject">🗑 Delete project</button></section>`}
function refreshCounts(){fieldSpecs.forEach(([id,,base])=>{let e=document.getElementById('cnt_'+id),area=document.getElementById('f_'+id);if(!e)return;let value=String(cur?.[id]||''),lim=Number(cur.limits?.[id]??base);e.textContent=n(value.length)+' / '+(lim?n(lim):'∞');e.className='count'+(lim&&value.length>lim?' warn':lim&&value.length>lim*.9?' near':'');area?.classList.toggle('overfield',!!(lim&&value.length>lim))});['userRole','userDynamics','userFreedom','theme'].forEach(id=>{let el=document.getElementById('cnt_'+id);if(el)el.textContent=n(String(cur[id]||'').length)+' tekens'});refreshDialogue()}
function renderVault(){viewName='identities';navHeader();root.innerHTML=`<div class="row spread"><div><p class="eyebrow">Identity vault</p><h1 style="margin:0">Character passports 🪪</h1><p class="hint">${n(identities.length)} vaste identities · avatars & voices</p></div><button class="primary" data-action="newidentity">＋ Passport</button></div><div class="navrow" style="margin:12px 0"><button class="button tiny" data-nav="catalog">← Catalog</button></div>${identities.length?`<div class="cards">${identities.slice().sort((a,b)=>stamp(b).localeCompare(stamp(a))).map(i=>card(i,'identity')).join('')}</div>`:`<div class="empty">👤<br><b>Nog geen paspoorten</b><p class="hint">Maak bijvoorbeeld een vaste identity voor Kade, herbruikbaar in meerdere bots.</p></div>`}`}
function renderIdentity(){viewName='identity';bindHeaderBack('character passport','identities');const linked=projects.filter(p=>p.identityIds?.includes(cur.id));root.innerHTML=`<div class="editorheading"><div class="edavatar">${imageBox(cur.avatars?.main)}</div><div class="edtitle"><p class="eyebrow">🪪 Character Passport</p><h1>${esc(cur.name||'Unnamed identity')}</h1><p class="hint">Gebruikt in ${linked.length} bot(s)</p></div></div><section class="section"><h2>Identity</h2>${fInput('name','Name','e.g. Kade')}${fInput('aliases','Aliases','Kade - MBF, MBF…')}<div class="two"><div>${fInput('age','Default age (optional)','27')}</div><div>${fInput('voiceName','Default voice name','Voice name')}</div></div>${textPlain('appearance','Fixed face / appearance reference','Hair, eyes, jawline, skin texture…')}${fInput('voiceId','Voice ID or label','Optional ID / voice name')}${textPlain('voiceNotes','Voice notes','Deep, raspy, soft spoken…')}</section><section class="section"><h2>Face references</h2>${avatarSlots('identity')}</section><section class="section"><h2>🎨 Avatar prompt builder</h2><p class="hint">Selecteer onderdelen. Je identity-beschrijving wordt gecombineerd met de chips, zonder je vaste uiterlijk te veranderen.</p>${textPlain('promptBase','Base prompt additions','Your own reusable base prompt…')}<div class="promptchips">${promptChips.map(c=>`<button class="chip ${cur.selectedChips?.includes(c)?'on':''}" data-promptchip="${esc(c)}" aria-pressed="${cur.selectedChips?.includes(c)?'true':'false'}">${esc(c)}</button>`).join('')}</div><div class="block"><div class="fieldtop"><b>Generated prompt</b><button class="primary tiny" data-action="copyprompt">📋 Copy prompt</button></div><p id="promptoutput" style="white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 0;font-size:13px">${esc(buildPrompt())||'<span class="hint">Voeg appearance, base prompt of chips toe.</span>'}</p></div></section><section class="section"><h2>🔗 Your tools</h2>${fInput('generatorUrl','Image generator shortcut (URL)','https://...')}${fInput('editorUrl','Image editor shortcut (URL)','https://...')}<div class="actions">${safeUrl(cur.generatorUrl)?`<a class="button tiny" href="${esc(safeUrl(cur.generatorUrl))}" target="_blank" rel="noopener noreferrer">↗ Generator</a>`:''}${safeUrl(cur.editorUrl)?`<a class="button tiny" href="${esc(safeUrl(cur.editorUrl))}" target="_blank" rel="noopener noreferrer">↗ Editor</a>`:''}</div></section><section class="section"><h2>Linked bots</h2>${linked.length?linked.map(p=>`<button class="button" data-open-project="${esc(p.id)}" style="margin:3px">${esc(p.name||p.title||'Untitled')} ↗</button>`).join(''):'<p class="hint">Koppel dit passport via Cast & User in een bot.</p>'}</section><div class="savebar"><button class="button" data-action="save">💾 Save now</button><button class="danger tiny" data-action="deleteidentity">Delete passport</button></div>`;setFlag('✓ opgeslagen',true)}
function buildPrompt(){return [cur?.appearance,cur?.promptBase,...(cur?.selectedChips||[])].filter(Boolean).join(', ')}
function renderData(){viewName='data';navHeader();root.innerHTML=`<p class="eyebrow">💾 Data & backup</p><h1>Keep your archive safe</h1><div class="section"><h2>Export backup</h2><p class="hint">Download één JSON-bestand met alle creaties, tekstversies, paspoorten en opgeslagen afbeeldingen. Maak regelmatig een kopie buiten je browser.</p><button class="primary" data-action="export">↓ Export full backup</button></div><div class="section"><h2>Import backup</h2><p class="hint">Voeg creaties en identities uit een eerder geëxporteerd Bot Studio JSON-bestand samen met de huidige gegevens. Bij gelijke ID's behoudt de app je bestaande gegevens.</p><label class="filelabel">＋ Choose backup file<input type="file" id="importFile" accept=".json,application/json"></label><p class="hint">Geen verbinding met de Stats Tracker. De oorspronkelijke tracker of zijn data worden niet gewijzigd.</p></div><div class="section"><h2>Storage & privacy</h2><p class="hint">De studio gebruikt IndexedDB op dit apparaat, in deze browser en onder deze website-adres. Je wachtwoord wordt gecontroleerd via dezelfde Cloudflare Worker als de Bot Tracker. Je creaties en avatars worden niet via die Worker opgeslagen: ze blijven lokaal in IndexedDB. Er is nog geen automatische cloudsynchronisatie. Browsergegevens wissen kan je archief verwijderen. De opslag is dus géén vervanging voor regelmatige back-ups.</p><p class="hint">Voor betrouwbaar gebruik op je iPhone: plaats dit bestand op een eigen HTTPS-webadres en voeg die pagina toe aan je beginscherm. Open niet uitsluitend een losse lokale HTML-file in Bestanden.</p><div class="actions"><button class="button tiny" data-nav="catalog">← Catalog</button><button class="button tiny" data-nav="identities">🪪 Identity Vault</button></div></div>`}
function updateCur(prop,val){if(!cur)return;cur[prop]=val;deferSave()}
function formatSelection(ta,mode){if(!ta)return;ta.focus();let a=ta.selectionStart,b=ta.selectionEnd,value=ta.value,left=mode==='quote'?'"':'*',right=mode==='quote'?'"':'*';ta.value=value.slice(0,a)+left+value.slice(a,b)+right+value.slice(b);ta.setSelectionRange(a+left.length,b+left.length);ta.dispatchEvent(new Event('input',{bubbles:true}))}
async function copyText(str){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(str)}else throw Error('fallback');toast('📋 Gekopieerd!')}catch(e){const ta=document.createElement('textarea');ta.value=str;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{let ok=document.execCommand('copy');toast(ok?'📋 Gekopieerd!':'Kopiëren niet beschikbaar op deze pagina')}catch(e){toast('Kopiëren niet beschikbaar — selecteer de tekst zelf')}ta.remove()}}
function createSnapshot(){let label=(cur.versionLabel||'').trim()||'Saved version';const keys=['name','type','status','title','introduction','greeting','background','personality','appearance','story','theme','categories','tags','pov','narrator','userRole','userDynamics','userFreedom','cid','trackerUrl','limits','dialogueLimit','dialogue','identityIds','relations','ageOverride'];const data={};keys.forEach(k=>data[k]=clone(cur[k]??null));cur.revisions=cur.revisions||[];cur.revisions.push({id:uid(),at:now(),label,data});cur.versionLabel='';return saveCurrent().then(()=>{toast('🕒 Snapshot bewaard');if(activeTab==='versions')renderEditor()})}
async function restoreSnapshot(id){let item=cur.revisions?.find(v=>v.id===id);if(!item)return;if(!confirm('Deze versie terugzetten? Je huidige tekst wordt vervangen. Sla eerst een snapshot op als je die wilt bewaren.'))return;let revs=cur.revisions, avatars=cur.avatars;Object.assign(cur,clone(item.data));cur.revisions=revs;cur.avatars=avatars;await saveCurrent();renderEditor();toast('Versie hersteld')}
async function imgAsDataUrl(file){if(!file||!file.type.startsWith('image/'))throw Error('Kies een afbeelding.');if(file.size>20*1024*1024)throw Error('Afbeelding groter dan 20 MB.');const blobURL=URL.createObjectURL(file);try{const img=new Image();img.src=blobURL;await new Promise((res,rej)=>{img.onload=res;img.onerror=rej});let max=980,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#1b191f';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);return c.toDataURL('image/jpeg',.84)}finally{URL.revokeObjectURL(blobURL)}}
async function exportBackup(){await flush();let data={application:'PolyBuzz Bot Studio',schemaVersion:1,exportedAt:now(),projects:await all('projects'),identities:await all('identities')};const json=JSON.stringify(data),blob=new Blob([json],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='bot-studio-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000);toast('💾 Back-up gedownload')}
async function importBackup(file){try{if(file.size>110*1024*1024)throw Error('Back-up is te groot');let raw=JSON.parse(await file.text());if(raw.application!=='PolyBuzz Bot Studio'||raw.schemaVersion!==1||!Array.isArray(raw.projects)||!Array.isArray(raw.identities))throw Error('Ongeldig Bot Studio V1-back-upbestand');if(raw.projects.length>15000||raw.identities.length>15000)throw Error('Te veel items');await flush();if(!confirm(`Importeren: ${raw.projects.length} bots en ${raw.identities.length} paspoorten? Bestaande IDs worden niet overschreven.`))return;const existingP=new Set(projects.map(p=>p.id)),existingI=new Set(identities.map(i=>i.id));let newP=0,newI=0;for(const o of raw.identities){if(o&&typeof o.id==='string'&&!existingI.has(o.id)){await txRun('identities','put',o);newI++;existingI.add(o.id)}}for(const o of raw.projects){if(o&&typeof o.id==='string'&&!existingP.has(o.id)){await txRun('projects','put',o);newP++;existingP.add(o.id)}}projects=await all('projects');identities=await all('identities');toast(`Import voltooid: ${newP} bots en ${newI} paspoorten toegevoegd`);await go('catalog')}catch(e){toast('Import mislukt: '+e.message)}}

if(d.nav){await go(d.nav);return}if(d.openProject){await go('editor',d.openProject);return}if(d.openIdentity){await go('identity',d.openIdentity);return}if(d.tab){await flush();activeTab=d.tab;renderEditor();return}

if(d.action==='rewrite'&&currentKind==='project'){if(!confirm('Nieuwe rewrite maken? Je originele creatie blijft bewaard.'))return;let p=clone(cur);p.id=uid();p.name=(cur.name||cur.title||'Untitled')+' — rewrite';p.status='Rewrite';p.createdAt=now();p.updatedAt=p.createdAt;p.sourceId=cur.id;p.revisions=[];p.dialogue=(p.dialogue||[]).map(b=>({...b,id:uid()}));projects.push(p);await txRun('projects','put',p);await go('editor',p.id);toast('🔄 Rewrite als apart project opgeslagen');return}

if(d.action==='addblock'){cur.dialogue.push({id:uid(),label:'',text:''});deferSave();const target=$('#dialogueList');if(target){let i=cur.dialogue.length-1;target.insertAdjacentHTML('beforeend',blockHtml(dialogueStats()[i]));refreshDialogue();target.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'})}return}
if(d.copyfield){await copyText(cur[d.copyfield]||'');return}

if(d.removeblock){if(cur.dialogue.length<=1){cur.dialogue[0].text='';cur.dialogue[0].label='';deferSave();renderEditor();toast('Leeg blok behouden');return}if(!confirm('Dit Dialogue Style-blok verwijderen?'))return;cur.dialogue=cur.dialogue.filter(x=>x.id!==d.removeblock);deferSave();renderEditor();return}
if(d.duplicate){let i=cur.dialogue.findIndex(x=>x.id===d.duplicate);if(i<0)return;let newB={...clone(cur.dialogue[i]),id:uid()};cur.dialogue.splice(i+1,0,newB);deferSave();renderEditor();return}
if(d.move){let i=cur.dialogue.findIndex(x=>x.id===d.blockid),j=i+(d.move==='up'?-1:1);if(i<0||j<0||j>=cur.dialogue.length)return;[cur.dialogue[i],cur.dialogue[j]]=[cur.dialogue[j],cur.dialogue[i]];deferSave();renderEditor();return}
if(d.restoreversion){await restoreSnapshot(d.restoreversion);return}
if(d.deleteavatar){if(!confirm('Deze avatar uit deze collectie verwijderen?'))return;cur.avatars[d.deleteavatar]=null;await saveCurrent();currentKind==='project'?renderEditor():renderIdentity();return}
if(d.promptchip){let xs=new Set(cur.selectedChips||[]);xs.has(d.promptchip)?xs.delete(d.promptchip):xs.add(d.promptchip);cur.selectedChips=[...xs];deferSave();b.classList.toggle('on',xs.has(d.promptchip));b.setAttribute('aria-pressed',String(xs.has(d.promptchip)));const o=$('#promptoutput');if(o)o.textContent=buildPrompt()||'Voeg appearance, base prompt of chips toe.';return}
if(d.action==='copyprompt'){await copyText(buildPrompt());return}
if(d.action==='deleteidentity'){const linked=projects.filter(p=>p.identityIds?.includes(cur.id));if(linked.length){toast(`Eerst ontkoppelen bij ${linked.length} bot(s)`);return}if(!confirm('Dit paspoort definitief verwijderen? Maak eerst een backup.'))return;let id=cur.id;await txRun('identities','delete',id);identities=identities.filter(x=>x.id!==id);cur=null;currentKind='';await go('identities');return}
if(d.action==='export'){await exportBackup();return}
if(b.id==='moreCards'){visibleCount+=48;updateCatalogList();return}

<script>
(() => {
  'use strict';
  const WORKER = 'https://bot-events.nnharmony.workers.dev';
  const SESSION_KEY = 'botStudioWorkerPasswordSession:v1';
  const REMEMBER_KEY = 'botStudioWorkerPasswordRemember:v1';
  const REMEMBER_MS = 7 * 24 * 60 * 60 * 1000;
  const gate = document.getElementById('studioGate');
  const shell = document.getElementById('studioShell');
  const form = document.getElementById('studioLoginForm');
  const field = document.getElementById('studioPassword');
  const button = document.getElementById('studioUnlockButton');
  const status = document.getElementById('studioGateStatus');
  let trying = false;
  const readSaved = () => {
    try {
      const session = sessionStorage.getItem(SESSION_KEY);
      if (session) return session;
    } catch (_) {}
    try {
      const stored = JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null');
      if (stored && typeof stored.key === 'string' && stored.key && Number(stored.expiresAt) > Date.now()) return stored.key;
    } catch (_) {}
    return '';
  };
  const forget = () => {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (_) {}
    try { localStorage.removeItem(REMEMBER_KEY); } catch (_) {}
  };
  const remember = password => {
    try { sessionStorage.setItem(SESSION_KEY, password); } catch (_) {}
    try { localStorage.setItem(REMEMBER_KEY, JSON.stringify({key:password, expiresAt:Date.now()+REMEMBER_MS})); } catch (_) {}
  };
  async function unlock(password) {
    if (trying || !password) return;
    trying = true;
    button.disabled = true;
    status.textContent = 'unlocking…';
    try {
      const response = await fetch(WORKER + '/unlock', {
        method:'POST',
        headers: {'x-events-key':password,'x-events-profile':'main'},
        cache:'no-store'
      });
      if (!response.ok) {
        let message = 'Wrong password';
        try { const result = await response.json(); message = result.error || message; } catch (_) {}
        throw new Error(message);
      }
      remember(password);
      field.value = '';
      gate.hidden = true;
      shell.hidden = false;
      status.textContent = '';
    } catch (error) {
      forget();
      gate.hidden = false;
      shell.hidden = true;
      status.textContent = error instanceof TypeError ? 'Kan Cloudflare niet bereiken. Controleer je verbinding.' : String(error.message || 'Unlock failed');
    } finally {
      trying = false;
      button.disabled = false;
    }
  }
  form.addEventListener('submit', e => { e.preventDefault(); unlock(field.value.trim()); });
  document.addEventListener('click', e => {
    if (e.target.closest('#studioLockButton')) {
      forget();
      field.value = '';
      shell.hidden = true;
      gate.hidden = false;
      status.textContent = '';
      field.focus();
    }
  });
  const previous = readSaved();
  if (previous) unlock(previous); else field.focus();
})();
</script>
